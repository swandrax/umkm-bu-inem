name: Security Audit (Scheduled)

on:
  schedule:
    # Setiap Senin jam 02:00 UTC (09:00 WIB)
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      severity:
        description: "Minimum severity to report"
        required: false
        default: "HIGH,CRITICAL"
        type: choice
        options:
          - "CRITICAL"
          - "HIGH,CRITICAL"
          - "MEDIUM,HIGH,CRITICAL"

permissions:
  contents: read
  issues: write
  security-events: write

env:
  TRIVY_SEVERITY: ${{ inputs.severity || 'HIGH,CRITICAL' }}

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Audit Maven/Java dependencies (OWASP)
  # ─────────────────────────────────────────────
  maven-audit:
    name: Maven Dependency-Check (OWASP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run OWASP Dependency-Check via Maven
        run: |
          ./mvnw --batch-mode org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -Dformat=HTML \
            -DprettyPrint=true \
            -DsuppressionFiles= \
            -Dnvd.api.key=${{ secrets.NVD_API_KEY || '' }}
        continue-on-error: true

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30

      - name: Check for critical findings
        id: owasp-result
        run: |
          if [ -f target/dependency-check-report.html ]; then
            VULN_COUNT=$(grep -oP 'vulnerabilityCount">\K[0-9]+' target/dependency-check-report.html | head -1 || echo "0")
            echo "vuln_count=${VULN_COUNT}" >> "$GITHUB_OUTPUT"
            echo "### 🔍 OWASP Dependency-Check Results" >> "$GITHUB_STEP_SUMMARY"
            echo "Vulnerabilities found: **${VULN_COUNT}**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "vuln_count=0" >> "$GITHUB_OUTPUT"
            echo "⚠️ Report file not generated" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────
  # Job 2: Audit npm/Node.js dependencies
  # ─────────────────────────────────────────────
  npm-audit:
    name: npm Audit (Frontend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit (production only)
        working-directory: frontend
        id: npm-audit
        run: |
          echo "### 📦 npm Audit Results (Production)" >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --audit-level=moderate 2>&1 | tee npm-audit-output.txt || true
          
          # Parse results
          if grep -q "found 0 vulnerabilities" npm-audit-output.txt; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
            echo "✅ No production vulnerabilities found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "status=vulnerable" >> "$GITHUB_OUTPUT"
            echo "⚠️ Vulnerabilities detected — see artifact for details" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: frontend/npm-audit-output.txt
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 3: Trivy scan (filesystem + Docker images)
  # ─────────────────────────────────────────────
  trivy-scan:
    name: Trivy CVE Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Scan source/lockfiles
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: ${{ env.TRIVY_SEVERITY }}
          format: table
          output: trivy-fs-report.txt
        continue-on-error: true

      # Build Docker images, lalu scan
      - name: Build Docker images
        run: docker compose build api web
        continue-on-error: true

      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: "ibuinem/api:local"
          severity: ${{ env.TRIVY_SEVERITY }}
          format: table
          output: trivy-api-image-report.txt
        continue-on-error: true

      - name: Trivy scan Web image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: "ibuinem/web:local"
          severity: ${{ env.TRIVY_SEVERITY }}
          format: table
          output: trivy-web-image-report.txt
        continue-on-error: true

      - name: Summarize Trivy results
        if: always()
        run: |
          echo "### 🛡️ Trivy Scan Results" >> "$GITHUB_STEP_SUMMARY"
          for f in trivy-fs-report.txt trivy-api-image-report.txt trivy-web-image-report.txt; do
            if [ -f "$f" ]; then
              LINES=$(wc -l < "$f")
              echo "- **${f}**: ${LINES} lines of output" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-fs-report.txt
            trivy-api-image-report.txt
            trivy-web-image-report.txt
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 4: Summary & auto-create issue if needed
  # ─────────────────────────────────────────────
  summary:
    name: Audit Summary & Issue Creation
    runs-on: ubuntu-24.04
    needs: [maven-audit, npm-audit, trivy-scan]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: reports/

      - name: Aggregate and create issue if vulnerabilities found
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            let hasVulnerabilities = false;
            let issueBody = `## 🔒 Security Audit Report — ${new Date().toISOString().slice(0, 10)}\n\n`;
            issueBody += `Triggered by: **${context.eventName}** (workflow run [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}))\n\n`;

            const reportsDir = 'reports';
            if (fs.existsSync(reportsDir)) {
              const files = fs.readdirSync(reportsDir);
              for (const file of files) {
                const content = fs.readFileSync(path.join(reportsDir, file), 'utf-8');
                if (content.trim()) {
                  // Check for vulnerability indicators
                  if (file.includes('npm-audit') && !content.includes('found 0 vulnerabilities')) {
                    hasVulnerabilities = true;
                  }
                  if (file.includes('trivy') && content.includes('Total:')) {
                    hasVulnerabilities = true;
                  }
                  if (file.includes('owasp') && content.includes('vulnerability')) {
                    hasVulnerabilities = true;
                  }
                  issueBody += `### 📄 ${file}\n\n`;
                  const truncated = content.length > 3000
                    ? content.slice(0, 3000) + '\n\n... (truncated, see artifact for full report)'
                    : content;
                  issueBody += `\`\`\`\n${truncated}\n\`\`\`\n\n`;
                }
              }
            }

            // Maven/npm/trivy job results
            const mavenResult = '${{ needs.maven-audit.result }}';
            const npmResult = '${{ needs.npm-audit.result }}';
            const trivyResult = '${{ needs.trivy-scan.result }}';

            if (mavenResult === 'failure' || npmResult === 'failure' || trivyResult === 'failure') {
              hasVulnerabilities = true;
            }

            issueBody += `## Job Results\n\n`;
            issueBody += `| Job | Status |\n|---|---|\n`;
            issueBody += `| Maven OWASP | ${mavenResult === 'success' ? '✅' : '⚠️'} ${mavenResult} |\n`;
            issueBody += `| npm Audit | ${npmResult === 'success' ? '✅' : '⚠️'} ${npmResult} |\n`;
            issueBody += `| Trivy Scan | ${trivyResult === 'success' ? '✅' : '⚠️'} ${trivyResult} |\n`;

            // Summary step
            await core.summary
              .addHeading('Security Audit Complete')
              .addRaw(hasVulnerabilities
                ? '⚠️ Vulnerabilities detected — GitHub Issue created.'
                : '✅ No actionable vulnerabilities found.')
              .write();

            if (hasVulnerabilities) {
              // Check for existing open issues to avoid duplicates
              const existingIssues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'security,automated-audit',
                per_page: 5,
              });

              if (existingIssues.data.length > 0) {
                // Comment on existing issue
                const issue = existingIssues.data[0];
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: issueBody,
                });
                core.info(`Updated existing issue #${issue.number}`);
              } else {
                // Create new issue
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `🔒 Security Audit: Vulnerabilities detected — ${new Date().toISOString().slice(0, 10)}`,
                  body: issueBody,
                  labels: ['security', 'automated-audit'],
                });
                core.info('Created new security issue');
              }
            }
