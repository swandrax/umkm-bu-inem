server:
  port: ${PORT:8080}

spring:
  application:
    name: jajanan-ibu-inem-pos
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jajanan_ibu_inem}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta&characterEncoding=UTF-8}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-min-32-bytes-change-in-production!!}
    expiration-ms: ${JWT_EXPIRATION:900000} # 15 menit
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  xendit:
    enabled: ${XENDIT_ENABLED:false}
    webhook-token: ${XENDIT_WEBHOOK_TOKEN:}
    api-version: ${XENDIT_API_VERSION:2024-11-11}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
